name: security-verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: webapp/frontend

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
        working-directory: webapp/frontend

      - name: Build frontend
        run: npm run build
        working-directory: webapp/frontend

      - name: Run frontend tests
        run: npm test
        working-directory: webapp/frontend

      - name: Install Python dependencies and auditor
        run: python -m pip install -r requirements.txt -r requirements-dev.txt pip-audit==2.10.1

      - name: Audit Python dependencies
        run: python -m pip_audit

      - name: Verify regression tests detect the original defect
        shell: bash
        run: |
          git show 62c9682b6e6d288c4f71ecd7c489f954eeb18f67:hardlink_organizer.py > "$RUNNER_TEMP/baseline_engine.py"
          BASELINE_ENGINE_PATH="$RUNNER_TEMP/baseline_engine.py" python - <<'PY'
          import importlib.util
          import os
          import sys
          import pytest

          spec = importlib.util.spec_from_file_location(
              "hardlink_organizer", os.environ["BASELINE_ENGINE_PATH"]
          )
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          class Results:
              failed = 0
              passed = 0

              def pytest_runtest_logreport(self, report):
                  if report.when == "call":
                      self.failed += int(report.failed)
                      self.passed += int(report.passed)

          results = Results()
          status = pytest.main([
              "-q", "tests/test_hardlink_organizer.py::TestDestinationContainment"
          ], plugins=[results])
          assert status == 1 and results.failed == 6 and results.passed == 1, (
              status, results.failed, results.passed
          )
          print("Confirmed: all six safety regressions detect the original defect.")
          PY

      - name: Run full Python test suite against the fix
        run: python -m pytest tests/ -q
