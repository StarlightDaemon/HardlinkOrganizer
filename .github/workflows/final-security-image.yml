name: final-security-image

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: final-security-image
  cancel-in-progress: false

env:
  IMAGE: starlightdaemon/hardlink-organizer
  RELEASE_TAG: v1.0.7

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out final release source
        uses: actions/checkout@v7

      - name: Validate release identity and unused version tag
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "v$(cat VERSION)" = "$RELEASE_TAG"
          python - <<'PY'
          import os
          from urllib.error import HTTPError
          from urllib.request import urlopen
          url = f"https://hub.docker.com/v2/repositories/{os.environ['IMAGE']}/tags/{os.environ['RELEASE_TAG']}"
          try:
              with urlopen(url, timeout=30):
                  raise SystemExit("Refusing to overwrite an existing versioned image.")
          except HTTPError as error:
              if error.code != 404:
                  raise
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Verify frontend test and dependency audit
        working-directory: webapp/frontend
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm test

      - name: Build fresh Linux amd64 candidate
        run: |
          docker build --pull --no-cache --platform linux/amd64 \
            -f packaging/docker/Dockerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$RELEASE_TAG" .
          mkdir -p "$RUNNER_TEMP/image-reports"
          docker image inspect "$IMAGE:$RELEASE_TAG" > "$RUNNER_TEMP/image-reports/image-inspect.json"

      - name: Run full Python suite against candidate as nonroot
        run: |
          python -m pip install --target "$RUNNER_TEMP/test-libs" -r requirements-dev.txt
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tests,dst=/app/tests,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/test-libs,dst=/tmp/test-libs,readonly" \
            -e PYTHONPATH=/tmp/test-libs:/app -e PYTHONDONTWRITEBYTECODE=1 \
            "$IMAGE:$RELEASE_TAG" python -m pytest /app/tests -q -p no:cacheprovider \
            | tee "$RUNNER_TEMP/image-reports/python-tests.txt"

      - name: Verify candidate HTTP runtime and security behavior
        run: |
          python packaging/docker/verify_image.py "$IMAGE:$RELEASE_TAG" \
            --version "${RELEASE_TAG#v}" --revision "$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/image-reports/candidate-smoke.txt"

      - name: Audit original candidate Python packages
        run: |
          docker run --rm --entrypoint python "$IMAGE:$RELEASE_TAG" -c \
            'import importlib.metadata as m; print(chr(10).join(sorted("{}=={}".format(d.metadata["Name"], d.version) for d in m.distributions())))' \
            > "$RUNNER_TEMP/image-reports/python-packages.txt"
          python -m venv "$RUNNER_TEMP/audit-env"
          "$RUNNER_TEMP/audit-env/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/audit-env/bin/python" -m pip_audit \
            --no-deps --disable-pip -r "$RUNNER_TEMP/image-reports/python-packages.txt" \
            2>&1 | tee "$RUNNER_TEMP/image-reports/python-audit.txt"

      - name: Scan candidate OS and language packages
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/image-reports:/reports" \
            aquasec/trivy:0.76.0 image --scanners vuln \
            --format json --output /reports/trivy.json "$IMAGE:$RELEASE_TAG"
          python - <<'PY'
          from collections import Counter
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "image-reports/trivy.json").read_text())
          counts = Counter()
          blockers = []
          for result in report.get("Results", []):
              for vulnerability in result.get("Vulnerabilities", []):
                  counts[vulnerability["Severity"]] += 1
                  if vulnerability["Severity"] in {"MEDIUM", "HIGH", "CRITICAL"} and vulnerability.get("FixedVersion"):
                      blockers.append(vulnerability)
          print("All reported image vulnerabilities by severity:", dict(counts))
          for vulnerability in blockers:
              print("FIXABLE BLOCKER:", vulnerability["VulnerabilityID"], vulnerability["PkgName"],
                    vulnerability["InstalledVersion"], "->", vulnerability["FixedVersion"])
          assert not blockers, "Image has fixable medium/high/critical vulnerabilities."
          PY

      - name: Log in to Docker Hub after candidate verification
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish verified versioned image
        id: published
        run: |
          docker push "$IMAGE:$RELEASE_TAG" | tee "$RUNNER_TEMP/image-reports/push-version.txt"
          digest=$(grep -Eo 'digest: sha256:[a-f0-9]{64}' "$RUNNER_TEMP/image-reports/push-version.txt" | tail -1 | cut -d' ' -f2)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$digest" > "$RUNNER_TEMP/image-reports/digest.txt"

      - name: Pull published image by digest and repeat runtime verification
        env:
          DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{.Id}}')" = \
               "$(docker image inspect "$IMAGE:$RELEASE_TAG" --format '{{.Id}}')"
          python packaging/docker/verify_image.py "$IMAGE@$DIGEST" \
            --version "${RELEASE_TAG#v}" --revision "$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/image-reports/published-smoke.txt"

      - name: Promote verified image to latest and verify tag digest
        env:
          DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          docker tag "$IMAGE:$RELEASE_TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest" | tee "$RUNNER_TEMP/image-reports/push-latest.txt"
          latest_digest=$(grep -Eo 'digest: sha256:[a-f0-9]{64}' "$RUNNER_TEMP/image-reports/push-latest.txt" | tail -1 | cut -d' ' -f2)
          test "$latest_digest" = "$DIGEST"
          docker pull "$IMAGE:latest"
          test "$(docker image inspect "$IMAGE:latest" --format '{{.Id}}')" = \
               "$(docker image inspect "$IMAGE@$DIGEST" --format '{{.Id}}')"
          echo "Published $IMAGE:$RELEASE_TAG and :latest at $DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final-security-image-evidence
          path: ${{ runner.temp }}/image-reports/
          if-no-files-found: warn
          retention-days: 30
